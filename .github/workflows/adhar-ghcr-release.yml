# Publish the Adhar fork's Plane images to GHCR.
#
# Deliberately NOT a modification of `build-branch.yml`: that workflow is
# upstream's DockerHub pipeline (per-arch matrix, composite actions, manifest
# merge) and keeping it untouched means an upstream merge does not conflict here.
# This file owns one job per image and architecture: build the six runnable
# images from the same Dockerfiles, push them by digest, then stitch each pair
# into a multi-arch manifest tagged ghcr.io/adhar-io/plane-*:<version>.
#
# Each architecture builds on its OWN native runner. The first release tried
# linux/amd64,linux/arm64 in one buildx step with QEMU, and the four JS images
# (pnpm install + Vite build of the whole monorepo) hit GitHub's six-hour job
# limit and were cancelled, so only plane-backend and plane-proxy ever reached
# the registry — the platform kept running the stock frontend, which cannot
# render the fork's Keycloak login.
#
# What the fork adds to these images is Keycloak / generic-OIDC login
# (`apps/api/plane/authentication/provider/oauth/keycloak.py` and the admin,
# web and space surfaces around it), so the Adhar platform can sign people in
# with the same realm that fronts every other platform service.
#
# The platform consumes the result from
# adhar/platform/stack/packages/application/plane/manifests/ (the `adhar` repo).
name: Adhar GHCR Release

on:
  push:
    tags:
      # Fork releases are tagged adhar-v<upstream version>-<n>, e.g.
      # adhar-v1.4.2-1, so upstream's own v* tags never trigger this.
      - "adhar-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the short SHA)"
        required: false
        type: string
      latest:
        description: "Also move the :latest tag to this build"
        required: false
        type: boolean
        default: false

concurrency:
  group: adhar-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: adhar-io

jobs:
  meta:
    name: Resolve the image tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - name: Resolve
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          latest=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # adhar-v1.4.2-1 -> 1.4.2-1, so the tag reads like a version.
            tag="${GITHUB_REF_NAME#adhar-v}"
            latest=true
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
            latest="${INPUT_LATEST}"
          else
            tag="${GITHUB_SHA::7}"
            latest="${INPUT_LATEST}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} (latest=${latest})"

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: meta
    # Native runners: no QEMU. ubuntu-24.04-arm is GitHub's hosted arm64 runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # One failing image must not hide the others — a partial set is still
      # diagnosable, and the platform pins one tag across all six.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [plane-backend, plane-frontend, plane-admin, plane-space, plane-live, plane-proxy]
        # Each include below matches one original matrix key, so GitHub adds its
        # extra fields to every combination with that key instead of creating
        # a new combination (the documented "expanding configurations" form).
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # Pushed untagged; the merge job below tags the multi-arch manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.tag }}
          # The Vite apps bake their base URLs at build time, but the platform
          # serves every surface from one host behind its gateway, so the
          # defaults (relative URLs) are what we want — do not pin a host here
          # or the image becomes environment-specific.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [plane-backend, plane-frontend, plane-admin, plane-space, plane-live, plane-proxy]
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          TAG: ${{ needs.meta.outputs.tag }}
          LATEST: ${{ needs.meta.outputs.latest }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          # Both architectures must be present, or the platform would pull a
          # manifest that silently lacks one of them.
          refs=()
          for f in *; do
            refs+=("${IMAGE}@sha256:${f}")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "expected 2 digests for ${IMAGE}, found ${#refs[@]}: ${refs[*]}"; exit 1
          fi
          tags=(-t "${IMAGE}:${TAG}")
          if [ "${LATEST}" = "true" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
